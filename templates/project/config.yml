languageCode: "en-us"
title: "{{ .Title }}"
copyright: SPAN Digital
pluralizelisttitles: false
params:
  _merge: deep
  sortByFilePath: true
  enterprise_key:
  frontmatter:
    - key: author
      type: email
      strict: false
    - key: title
      type: text
      strict: true
markup:
  goldmark:
    renderer:
      Unsafe: true
    parser:
      attribute:
        block: true
  highlight:
    style: github
menu:
  main:
    - identifier: 01-overview
      name: Overview
      url: /
      weight: 1
    - identifier: 02-plan
      name: Plan
      url: /plan/
      weight: 2
    - identifier: 03-status
      name: Status
      url: /status/
      weight: 3
    - identifier: 04-solution
      name: Solution
      url: /solution/
      weight: 4
    - identifier: 05-team
      name: Team & Roles
      url: /team/
      weight: 5
    - identifier: 06-technology
      name: Technology
      url: /technology/
      weight: 6
outputFormats:
  MenuIndex:
    baseName: menu
    mediaType: application/json
  SearchMap:
    baseName: searchmap
    mediaType: application/json
outputs:
  home:
    - HTML
    - RSS
    - MenuIndex
    - SearchMap
module:
  _merge: shallow
  imports:
    - path: github.com/spandigital/presidium-styling-base
      mounts:
        - source: assets
          target: assets
        - source: static
          target: static
    - path: github.com/spandigital/presidium-layouts-base
enableInlineShortcodes: true
frontmatter:
  lastmod:
    - lastmod
    - :fileModTime
    - :default
