version: 2

before:
  hooks:
    - go mod tidy
    - make prepare-themes

builds:
  - id: unix
    tags:
      - extended
    env:
      - CGO_ENABLED=1
    ldflags:
      - -s -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-linux-gnu
          - CXX=zig c++ -target x86_64-linux-gnu
      - goos: linux
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-linux-gnu
          - CXX=zig c++ -target aarch64-linux-gnu
      - goos: darwin
        goarch: amd64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target x86_64-macos
          - CXX=zig c++ -target x86_64-macos
      - goos: darwin
        goarch: arm64
        env:
          - CGO_ENABLED=1
          - CC=zig cc -target aarch64-macos
          - CXX=zig c++ -target aarch64-macos

archives:
  - name_template: '{{ .ProjectName }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else if eq .Arch "386" }}i386{{ else }}{{ .Arch }}{{ end }}{{ if .Arm }}v{{ .Arm }}{{ end }}'
    files:
      - LICENSE*
      - README*
      - CHANGELOG*

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: presidium
    homepage: "https://github.com/spandigital/presidium"
    description: "Presidium is a software documentation management system for agile teams"
    repository:
      owner: spandigital
      name: homebrew-tap
      token: "{{ .Env.GH_ACCESS_TOKEN }}"
    directory: Formula
    install: |
      bin.install "presidium"
    test: |
      assert_match "CLI tools for managing Presidium", shell_output("#{bin}/presidium --help")
