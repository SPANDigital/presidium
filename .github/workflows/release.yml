name: Go Releaser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    environment: releaser
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser via goreleaser-cross
        # goreleaser-cross bundles Go, goreleaser, osxcross (with macOS SDK) and
        # gcc cross toolchains for linux. This is required because zig 0.11.0
        # cannot satisfy darwin's CoreFoundation/Security framework symbols when
        # cross-compiling cgo from a linux runner.
        run: |
          docker run --rm \
            -v "$(pwd):/go/src/github.com/SPANDigital/presidium-hugo" \
            -w /go/src/github.com/SPANDigital/presidium-hugo \
            -e GITHUB_TOKEN \
            -e GH_ACCESS_TOKEN \
            ghcr.io/goreleaser/goreleaser-cross:v1.25.9 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
