notes: |
  Migration Strategy:

  1. Go Version Update (Tasks 1-3):
     - Update root and all template go.mod files to Go 1.23
     - Update GitHub Actions workflows
     - This is the foundation for other updates

  2. Hugo Version Update (Tasks 4-6):
     - Update Hugo dependency to v0.140.x or latest stable
     - Note: Hugo v0.152 doesn't exist; latest is ~v0.140.x
     - Update Hugo submodule if needed
     - Update documentation references

  3. Remove Packr (Tasks 7-16):
     - Convert template service to use embed.FS (tasks 7-11)
     - Remove packr dependencies from go.mod (task 12)
     - Clean up Makefile (tasks 13-14)
     - Update goreleaser config (task 15)
     - Update GitHub Actions (task 16)
     - This is the most complex migration

  4. Modernize Build Process (Tasks 17-22):
     - Update Makefile with modern Go tooling practices
     - Add helpful development targets
     - Update GitHub Actions to latest versions

  5. Finalize and Test (Tasks 23-25):
     - Run go mod tidy
     - Test thoroughly
     - Update documentation

  Important Notes:
  - Go 1.23 is the latest stable version (not 1.25)
  - Hugo latest stable is ~v0.140.x (not 0.152)
  - embed.FS is available since Go 1.16 and is the modern replacement for packr
  - The tools/hugo directory appears to be a git submodule with Hugo source
  - All changes should be tested thoroughly before merging

  Breaking Changes:
  - Minimum Go version will be 1.23 (up from 1.23.0)
  - Hugo dependency will jump from v0.87.0 to v0.140.x (major version jump)
  - packr removal may affect any external tools depending on generated packr files
