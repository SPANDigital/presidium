notes: |
  Migration Strategy:

  1. Go Version Update (Tasks 1-3):
     - Update root and all template go.mod files to Go 1.25
     - Update GitHub Actions workflows
     - This is the foundation for other updates

  2. Hugo Version Update (Tasks 4-6):
     - Update Hugo dependency to v0.155.3 (latest stable as of 2026-02-17)
     - Update Hugo submodule if needed
     - Update documentation references

  3. Remove Packr (Tasks 7-16):
     - Convert template service to use embed.FS (tasks 7-11)
     - Remove packr dependencies from go.mod (task 12)
     - Clean up Makefile (tasks 13-14)
     - Update goreleaser config (task 15)
     - Update GitHub Actions (task 16)
     - This is the most complex migration

  4. Modernize Build Process (Tasks 17-22):
     - Update Makefile with modern Go tooling practices
     - Add helpful development targets
     - Update GitHub Actions to latest versions

  5. Remove Deprecated Packages (Tasks 26-29):
     - Replace pkg/errors with stdlib errors/fmt.Errorf (task 26)
     - Migrate yaml.v2 to yaml.v3 (task 27)
     - Update Masterminds/sprig v2 to v3 (task 28)
     - Replace Masterminds/goutils with stdlib alternatives (task 29)

  6. Update Outdated Packages (Tasks 30-37):
     - cobra v1.5.0 -> v1.8.x (task 30)
     - viper v1.10.0 -> v1.18.x (task 31)
     - afero v1.8.2 -> v1.11.x (task 32)
     - logrus v1.8.1 -> v1.9.x (task 33)
     - goquery v1.7.1 -> v1.9.x (task 34)
     - otiai10/copy v1.2.0 -> v1.14.x (task 35)
     - promptui v0.8.0 -> v0.9.x (task 36)
     - gomega v1.10.1 -> v1.36.x (task 37)

  7. Finalize and Test (Tasks 23-25):
     - Run go mod tidy
     - Test thoroughly
     - Update documentation

  Important Notes:
  - Go 1.25 is the target version for this upgrade
  - Hugo latest stable is v0.155.3 (as of 2026-02-17)
  - embed.FS is available since Go 1.16 and is the modern replacement for packr
  - The tools/hugo directory appears to be a git submodule with Hugo source
  - All changes should be tested thoroughly before merging

  Breaking Changes:
  - Minimum Go version will be 1.25 (up from 1.23.0)
  - Hugo dependency will jump from v0.87.0 to v0.155.3 (major version jump)
  - packr removal may affect any external tools depending on generated packr files
